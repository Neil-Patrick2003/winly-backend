; PHP defaults to 2M, which rejects an ordinary phone photo before the request
; ever reaches Laravel. These have to sit above the API's own limits:
; 10MB per photo and 100MB per clip, with post_max_size above upload_max_filesize
; so a multi-file post is not cut off by the envelope.
upload_max_filesize = 100M
post_max_size = 120M
memory_limit = 256M
max_execution_time = 120
